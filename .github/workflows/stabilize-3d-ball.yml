name: Stabilize 3D ball

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch resting collision physics
        shell: python
        run: |
          from pathlib import Path
          p = Path('3d.html')
          s = p.read_text(encoding='utf-8')
          old = "const vn=velocity.x*ax+velocity.y*ay;if(vn<0){velocity.x-=vn*1.12*ax;velocity.y-=vn*1.12*ay}const tx=-ay,ty=ax,tv=velocity.x*tx+velocity.y*ty;velocity.x=tx*tv*.92;velocity.y=ty*tv*.92;velocity.x*=.9;velocity.y*=.9"
          new = "const vn=velocity.x*ax+velocity.y*ay;if(vn<0){velocity.x-=vn*ax;velocity.y-=vn*ay}const tx=-ay,ty=ax,tv=velocity.x*tx+velocity.y*ty;velocity.x=tx*tv*.92;velocity.y=ty*tv*.92;if(Math.hypot(velocity.x,velocity.y)<1.2){velocity.x=0;velocity.y=0}"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Patch already applied or target changed; leaving file unchanged.')
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/stabilize-3d-ball.yml
          git add 3d.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix 3D ball resting jitter"
          git push