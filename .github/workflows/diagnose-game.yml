name: Diagnose Gravity Maze

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser diagnostics against local and live site
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            for (const target of ['http://127.0.0.1:4173/index.html','https://sumankayal247.github.io/Gravity-Maze/?diagnostic=1']) {
              const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
              const errors = [];
              page.on('console', msg => { if (msg.type() === 'error') errors.push('CONSOLE: ' + msg.text()); });
              page.on('pageerror', err => errors.push('PAGEERROR: ' + err.stack));
              page.on('requestfailed', req => errors.push('REQUEST FAILED: ' + req.url() + ' :: ' + req.failure()?.errorText));
              try {
                await page.goto(target, { waitUntil: 'networkidle', timeout: 30000 });
                await page.waitForTimeout(2000);
                const canvasCount = await page.locator('canvas').count();
                const canvasSize = canvasCount ? await page.locator('canvas').first().evaluate(c => ({width:c.width,height:c.height})) : null;
                const gameChildren = await page.locator('#game').evaluate(el => el.children.length);
                console.log(JSON.stringify({target, canvasCount, canvasSize, gameChildren, errors}, null, 2));
                await page.screenshot({ path: '/tmp/' + (target.startsWith('http://') ? 'local' : 'live') + '.png', fullPage: false });
              } catch (e) {
                console.log(JSON.stringify({target, fatal: String(e), errors}, null, 2));
              }
              await page.close();
            }
            await browser.close();
          })();
          NODE
          cat /tmp/server.log || true

      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravity-maze-live-diagnostic
          path: /tmp/*.png
