name: Fix Desktop Guide UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix desktop guide CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_media = '@media(min-width:801px) and (pointer:fine){.desktopGuide{display:flex}}'
          new_media = '@media(min-width:801px) and (pointer:fine){.desktopGuide.show{display:flex}}'
          old_b = '.guideStep b{display:block;font-size:11px;margin-bottom:3px}'
          new_b = '.guideStep > div > b{display:block;font-size:11px;margin-bottom:3px}'
          changed = False
          if old_media in s:
              s = s.replace(old_media, new_media, 1)
              changed = True
          if old_b in s:
              s = s.replace(old_b, new_b, 1)
              changed = True
          if changed:
              p.write_text(s)
          else:
              print('No matching desktop-guide CSS found; nothing to change.')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add index.html
            git commit -m "Fix desktop instructions overlay"
            git push
          fi
