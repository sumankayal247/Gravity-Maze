name: Add 3D mode button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 3D mode launcher
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '<!-- GRAVITY-MAZE-3D-BUTTON -->'
          if marker not in s:
              injection = '''<!-- GRAVITY-MAZE-3D-BUTTON -->\n<a href="./3d.html" aria-label="Open 3D mode" style="position:fixed;z-index:9;right:max(10px,env(safe-area-inset-right));top:76px;display:flex;align-items:center;gap:7px;height:38px;padding:0 13px;border:1px solid #6b3f8e;border-radius:11px;background:#0b0712ee;color:#e5c8ff;text-decoration:none;font:800 10px system-ui,sans-serif;letter-spacing:.1em;backdrop-filter:blur(10px);box-sizing:border-box;box-shadow:0 0 18px #6b3f8e22;pointer-events:auto;">◈ 3D MODE</a>'''
              s = s.replace('</body>', injection + '</body>')
              p.write_text(s)
          else:
              print('3D button already present')
      - name: Commit button
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add 3D mode button [skip ci]"
          git push
