<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravity Maze</title><style>
html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}body{font-family:system-ui;color:#eee}#game{position:fixed;inset:0;z-index:0}canvas{display:block}#hud{position:fixed;z-index:5;top:14px;left:14px;right:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}.p{background:#070a10ee;border:1px solid #303746;border-radius:14px;padding:11px 15px;backdrop-filter:blur(10px);box-sizing:border-box}.t{font-weight:900;letter-spacing:.18em}.s{font-size:9px;color:#818b9c;letter-spacing:.1em;margin-top:3px}.stats{display:flex;gap:18px}.stats small{display:block;color:#70798a;font-size:8px;text-transform:uppercase}.stats b{font-size:13px}.a{color:#c66cff}.ctl{font-size:10px;color:#8993a4;text-align:right}.k{padding:2px 6px;border:1px solid #424957;border-radius:5px;background:#171c24;color:#fff}@media(max-width:800px){#hud{top:8px;left:8px;right:8px}.ctl{display:none}.stats{gap:8px}.p{padding:8px 10px}.stats>div:nth-child(2){display:none}}
</style></head><body><div id="game"></div><div id="hud"><div class="p"><div class="t">GRAVITY <span class="a">MAZE</span></div><div class="s">ROTATE THE WORLD · FOLLOW GRAVITY</div></div><div class="p stats"><div><small>Maze</small><b id="lv">01</b></div><div><small>Size</small><b id="sz">15 × 11</b></div><div><small>Rotation</small><b id="an">0°</b></div><div><small>Difficulty</small><b class="a" id="df">WARM-UP</b></div></div><div class="p ctl"><span class="k">A</span><span class="k">D</span> / <span class="k">←</span><span class="k">→</span> Rotate<br><span class="k">R</span> Restart</div></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
const C=(v,a,b)=>Math.max(a,Math.min(b,v));
const CFG=n=>{const s=Math.min(n-1,14);return{c:15+2*s,r:11+s,t:44-2*s}};
const GEN=(c,r)=>{const g=Array.from({length:r},()=>Array(c).fill('#')),st=[{x:1,y:1}],ds=[[2,0],[-2,0],[0,2],[0,-2]];g[1][1]=' ';while(st.length){const p=st[st.length-1],o=ds.map(d=>({x:p.x+d[0],y:p.y+d[1],wx:p.x+d[0]/2,wy:p.y+d[1]/2})).filter(n=>n.x>0&&n.x<c-1&&n.y>0&&n.y<r-1&&g[n.y][n.x]=='#');if(!o.length){st.pop();continue}const n=o[Math.random()*o.length|0];g[n.wy][n.wx]=g[n.y][n.x]=' ';st.push({x:n.x,y:n.y})}const q=[{x:1,y:1,d:0}],seen=new Set(['1,1']);let far=q[0];for(let i=0;i<q.length;i++){const p=q[i];if(p.d>far.d)far=p;for(const d of ds){const x=p.x+d[0],y=p.y+d[1],k=x+','+y;if(x>0&&x<c-1&&y>0&&y<r-1&&g[y][x]==' '&&!seen.has(k)){seen.add(k);q.push({x,y,d:p.d+1})}}}g[far.y][far.x]='E';return g};
class Maze extends Phaser.Scene{
preload(){this.load.image('wall','wall.svg');this.load.image('floor','floor.svg');this.load.image('hole','blackhole.svg')}
create(){this.n=+(localStorage.gmLevel||1);this.keys=this.input.keyboard.addKeys('A,D,LEFT,RIGHT,R');this.build();this.scale.on('resize',()=>this.layout());}
cell(ch){for(let y=0;y<this.r;y++){const x=this.g[y].indexOf(ch);if(x>=0)return new Phaser.Math.Vector2(x*this.t+this.t/2-this.cx,y*this.t+this.t/2-this.cy)}return new Phaser.Math.Vector2()}
layout(){if(!this.root)return;const w=this.scale.width,h=this.scale.height;const top=Math.min(110,h*.16),bottom=Math.min(70,h*.10),availH=Math.max(260,h-top-bottom);this.root.x=w/2;this.root.y=top+availH/2;this.root.setScale(Math.min(1,(w-40)/(this.c*this.t),(availH-30)/(this.r*this.t)));}
build(){if(this.root)this.root.destroy();this.cfg=CFG(this.n);this.c=this.cfg.c;this.r=this.cfg.r;this.t=this.cfg.t;this.g=GEN(this.c,this.r);this.cx=this.c*this.t/2;this.cy=this.r*this.t/2;this.a=0;this.done=false;this.root=this.add.container(0,0);this.root.add(this.add.tileSprite(0,0,this.c*this.t,this.r*this.t,'floor').setOrigin(.5));for(let y=0;y<this.r;y++)for(let x=0;x<this.c;x++)if(this.g[y][x]=='#')this.root.add(this.add.image(x*this.t+this.t/2-this.cx,y*this.t+this.t/2-this.cy,'wall').setDisplaySize(this.t-1,this.t-1));this.exit=this.cell('E');this.root.add(this.add.image(this.exit.x,this.exit.y,'hole').setDisplaySize(this.t*1.45,this.t*1.45));this.ball=this.add.circle(this.t*1.5-this.cx,-this.r*this.t*.45,Math.min(12,this.t*.24),0xf3f4ff).setStrokeStyle(2,0xc56cff);this.root.add(this.ball);this.p=new Phaser.Math.Vector2(this.ball.x,this.ball.y);this.v=new Phaser.Math.Vector2();this.drop=1;this.layout();document.getElementById('lv').textContent=String(this.n).padStart(2,'0');document.getElementById('sz').textContent=this.c+' × '+this.r;document.getElementById('df').textContent=this.n<4?'WARM-UP':this.n<8?'FOCUS':this.n<13?'HARD':'EXTREME';document.getElementById('an').textContent='0°';}
update(_,ms){if(this.done)return;const dt=Math.min(ms/1000,.016),k=this.keys;if(Phaser.Input.Keyboard.JustDown(k.R)){this.build();return}const d=(k.D.isDown||k.RIGHT.isDown?1:0)-(k.A.isDown||k.LEFT.isDown?1:0);this.a+=d*115*dt;this.root.rotation=Phaser.Math.DegToRad(this.a);document.getElementById('an').textContent=Math.round(this.a)+'°';if(this.drop){this.drop=Math.max(0,this.drop-dt*1.8);this.ball.y=Phaser.Math.Linear(-this.r*this.t*.45,this.p.y,1-this.drop);if(!this.drop)this.ball.setPosition(this.p.x,this.p.y);return}
const rad=Phaser.Math.DegToRad(this.a);this.v.x+=Math.sin(rad)*1500*dt;this.v.y+=Math.cos(rad)*1500*dt;this.v.scale(Math.pow(.965,dt*60));if(this.v.length()>760)this.v.setLength(760);let np=this.p.clone().add(this.v.clone().scale(dt)),rr=this.ball.radius;for(let y=Math.max(0,Math.floor((np.y+this.cy-rr)/this.t)-1);y<=Math.min(this.r-1,Math.floor((np.y+this.cy+rr)/this.t)+1);y++)for(let x=Math.max(0,Math.floor((np.x+this.cx-rr)/this.t)-1);x<=Math.min(this.c-1,Math.floor((np.x+this.cx+rr)/this.t)+1);x++)if(this.g[y][x]=='#'){const l=x*this.t-this.cx,q=y*this.t-this.cy,R=l+this.t,B=q+this.t,px=C(np.x,l,R),py=C(np.y,q,B),dx=np.x-px,dy=np.y-py,ds=dx*dx+dy*dy;if(ds<rr*rr){const z=Math.sqrt(ds)||.001,nx=dx/z,ny=dy/z;np.x=px+nx*(rr+.5);np.y=py+ny*(rr+.5);const vn=this.v.x*nx+this.v.y*ny;if(vn<0){this.v.x-=vn*1.7*nx;this.v.y-=vn*1.7*ny}this.v.scale(.82)}}this.p.copy(np);this.ball.setPosition(np.x,np.y);if(Phaser.Math.Distance.Between(np.x,np.y,this.exit.x,this.exit.y)<this.t*.55){this.done=true;this.tweens.add({targets:this.ball,x:this.exit.x,y:this.exit.y,scale:.05,alpha:0,duration:500,ease:'Cubic.easeIn',onComplete:()=>{this.n++;localStorage.gmLevel=this.n;this.build()}})}}}
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:window.innerWidth,height:window.innerHeight,backgroundColor:'#05070b',scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},scene:Maze,render:{antialias:true},fps:{target:120}});
</script></body></html>
