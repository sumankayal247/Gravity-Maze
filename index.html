<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravity Maze</title>
<style>
html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}body{font-family:Inter,system-ui,sans-serif;color:#eef2ff}#hud{position:fixed;z-index:5;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}.panel{background:rgba(7,10,16,.82);border:1px solid rgba(180,190,220,.2);border-radius:14px;padding:12px 16px;backdrop-filter:blur(12px)}.title{font-weight:900;letter-spacing:.18em}.sub{font-size:10px;color:#7f899b;margin-top:4px;letter-spacing:.12em}.stats{display:flex;gap:22px}.stat small{display:block;color:#6e788b;font-size:8px;text-transform:uppercase;letter-spacing:.14em}.stat b{font-size:13px}.accent{color:#c873ff}.controls{font-size:10px;color:#8993a5}.key{border:1px solid #3b4351;border-radius:5px;padding:2px 6px;color:#fff;background:#171c25;margin:0 2px}@media(max-width:850px){.stats{gap:9px}.controls{display:none}.panel{padding:9px 11px}.title{font-size:14px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="panel"><div class="title">GRAVITY <span class="accent">MAZE</span></div><div class="sub">ROTATE THE WORLD · FOLLOW GRAVITY</div></div>
 <div class="panel stats"><div class="stat"><small>Maze</small><b id="maze">01</b></div><div class="stat"><small>Size</small><b id="size">15 × 11</b></div><div class="stat"><small>Rotation</small><b id="angle">0°</b></div><div class="stat"><small>Difficulty</small><b class="accent" id="difficulty">WARM-UP</b></div></div>
 <div class="panel controls"><span class="key">A</span><span class="key">D</span> or <span class="key">←</span><span class="key">→</span> Rotate<br><span class="key">R</span> Restart</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function config(level){const s=Math.min(level-1,14);return{cols:15+s*2,rows:11+s,tile:44-s*2};}
function maze(cols,rows){const g=Array.from({length:rows},()=>Array(cols).fill('#'));const stack=[{x:1,y:1}];g[1][1]=' ';const ds=[{x:2,y:0},{x:-2,y:0},{x:0,y:2},{x:0,y:-2}];while(stack.length){const c=stack[stack.length-1], opts=ds.map(d=>({x:c.x+d.x,y:c.y+d.y,wx:c.x+d.x/2,wy:c.y+d.y/2})).filter(n=>n.x>0&&n.x<cols-1&&n.y>0&&n.y<rows-1&&g[n.y][n.x]==='#');if(!opts.length){stack.pop();continue}const n=opts[Math.floor(Math.random()*opts.length)];g[n.wy][n.wx]=' ';g[n.y][n.x]=' ';stack.push({x:n.x,y:n.y});}let q=[{x:1,y:1}],seen=new Set(['1,1']),far=q[0];for(let i=0;i<q.length;i++){const c=q[i];if(i>0&&i>far.d)far={...c,d:i};for(const d of ds.map(x=>({x:x.x/2,y:x.y/2}))){const x=c.x+d.x*2,y=c.y+d.y*2,k=x+','+y;if(x>0&&x<cols-1&&y>0&&y<rows-1&&g[y][x]===' '&&!seen.has(k)){seen.add(k);q.push({x,y});}}}g[far.y][far.x]='E';return g;}
class Game extends Phaser.Scene{
 create(){this.level=Number(localStorage.gmLevel||1);this.makeLevel();this.keys=this.input.keyboard.addKeys('A,D,LEFT,RIGHT,R');}
 makeLevel(){this.cfg=config(this.level);this.grid=maze(this.cfg.cols,this.cfg.rows);this.cols=this.cfg.cols;this.rows=this.cfg.rows;this.tile=this.cfg.tile;this.angle=0;this.done=false;this.worldX=(this.cols*this.tile)/2;this.worldY=(this.rows*this.tile)/2;this.root=this.add.container(this.worldX,this.worldY);this.floor=this.add.tileSprite(0,0,this.cols*this.tile,this.rows*this.tile,'floor').setOrigin(.5);this.root.add(this.floor);this.walls=this.add.group();for(let y=0;y<this.rows;y++)for(let x=0;x<this.cols;x++)if(this.grid[y][x]==='#')this.walls.add(this.add.image(x*this.tile+this.tile/2-this.worldX,y*this.tile+this.tile/2-this.worldY,'wall').setDisplaySize(this.tile-1,this.tile-1));this.root.add(this.walls.getChildren());this.exit=this.find('E');this.hole=this.add.image(this.exit.x-this.worldX,this.exit.y-this.worldY,'blackhole').setDisplaySize(this.tile*1.45,this.tile*1.45);this.root.add(this.hole);this.ball=this.add.circle(0,0,Math.min(12,this.tile*.24),0xf1f4ff).setStrokeStyle(2,0xb67aff);this.root.add(this.ball);this.ballPos=new Phaser.Math.Vector2(-this.worldX+this.tile*1.5,-this.worldY+this.tile*1.5);this.vel=new Phaser.Math.Vector2(0,0);this.spawnY=-this.rows*this.tile*.42;this.ball.y=this.spawnY;this.ball.x=this.ballPos.x;this.drop=1;this.updateHud();}
 find(ch){for(let y=0;y<this.rows;y++){const x=this.grid[y].indexOf(ch);if(x>=0)return new Phaser.Math.Vector2(x*this.tile+this.tile/2,y*this.tile+this.tile/2)}return new Phaser.Math.Vector2(this.tile*1.5,this.tile*1.5)}
 updateHud(){maze.textContent=String(this.level).padStart(2,'0');size.textContent=`${this.cols} × ${this.rows}`;difficulty.textContent=this.level<4?'WARM-UP':this.level<8?'FOCUS':this.level<13?'HARD':'EXTREME';}
 update(_,delta){if(this.done)return;const dt=Math.min(delta/1000,.025);if(Phaser.Input.Keyboard.JustDown(this.keys.R)){this.makeLevel();return}let dir=0;if(this.keys.A.isDown||this.keys.LEFT.isDown)dir=-1;if(this.keys.D.isDown||this.keys.RIGHT.isDown)dir=1;this.angle+=dir*1.8*dt;this.root.rotation=Phaser.Math.DegToRad(this.angle);const rad=Phaser.Math.DegToRad(-this.angle),g=new Phaser.Math.Vector2(Math.sin(rad)*1250,Math.cos(rad)*1250);if(this.drop>0){this.drop=Math.max(0,this.drop-dt*1.8);this.ball.y=Phaser.Math.Linear(this.spawnY,this.ballPos.y,1-this.drop);this.vel.set(0,0);if(!this.drop)this.ball.y=this.ballPos.y;return}this.vel.x+=g.x*dt;this.vel.y+=g.y*dt;this.vel.scale(Math.pow(.965,dt*60));const speed=this.vel.length();if(speed>720)this.vel.setLength(720);let p=this.ballPos.clone().add(this.vel.clone().scale(dt));const r=this.ball.radius;for(let y=Math.max(0,Math.floor((p.y+this.worldY-r)/this.tile)-1);y<=Math.min(this.rows-1,Math.floor((p.y+this.worldY+r)/this.tile)+1);y++)for(let x=Math.max(0,Math.floor((p.x+this.worldX-r)/this.tile)-1);x<=Math.min(this.cols-1,Math.floor((p.x+this.worldX+r)/this.tile)+1);x++){if(this.grid[y][x]!=='#')continue;const l=x*this.tile-this.worldX,t=y*this.tile-this.worldY,rr=l+this.tile,b=t+this.tile,cx=clamp(p.x,l,rr),cy=clamp(p.y,t,b),dx=p.x-cx,dy=p.y-cy,ds=dx*dx+dy*dy;if(ds<r*r){const d=Math.sqrt(ds)||.001;const nx=dx/d,ny=dy/d;p.x=cx+nx*(r+.5);p.y=cy+ny*(r+.5);const vn=this.vel.x*nx+this.vel.y*ny;if(vn<0){this.vel.x-=vn*1.55*nx;this.vel.y-=vn*1.55*ny;}this.vel.scale(.82);}}
this.ballPos.copy(p);this.ball.setPosition(p.x,p.y);const ex=this.exit.x-this.worldX,ey=this.exit.y-this.worldY;if(Phaser.Math.Distance.Between(p.x,p.y,ex,ey)<this.tile*.52){this.done=true;this.tweens.add({targets:this.ball,x:ex,y:ey,scale:.05,alpha:0,duration:450,ease:'Cubic.easeIn',onComplete:()=>{this.level++;localStorage.gmLevel=this.level;this.makeLevel();}});}angle.textContent=`${Math.round(this.angle)}°`;}
}
const game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:1280,height:820,backgroundColor:'#05070b',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Game],render:{antialias:true},fps:{target:120,forceSetTimeOut:false}});
game.scene.start('Game');
</script>
</body></html>
